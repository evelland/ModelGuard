name: Offline prototype tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: python -m pip install "torch>=2.3,<3" --index-url https://download.pytorch.org/whl/cpu
      - name: Validate Python syntax
        run: python -m compileall -q prototype
      - name: Run offline unit tests (no model downloads)
        run: python -m unittest discover -s prototype/tests -v
