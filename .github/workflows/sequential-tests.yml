name: Sequential experiment tests

on:
  pull_request:
    paths:
      - 'prototype/sequential_*.py'
      - 'prototype/tests/test_sequential.py'
      - 'prototype/tests/test_sequential_run.py'
      - 'prototype/tests/test_sequential_diagnose.py'
      - 'prototype/tests/test_sequential_transfer_probe.py'
      - '.github/workflows/sequential-tests.yml'
  push:
    branches: [experiment/sequential-mappings]

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax validation
        run: python -m compileall -q prototype
      - name: Test sequential experiment
        run: python -m unittest prototype.tests.test_sequential prototype.tests.test_sequential_run prototype.tests.test_sequential_diagnose prototype.tests.test_sequential_transfer_probe -v
      - name: Generate deterministic disjoint and shared data
        run: |
          python prototype/sequential_data.py --condition disjoint --out /tmp/modelguard-disjoint
          python prototype/sequential_data.py --condition shared --out /tmp/modelguard-shared
